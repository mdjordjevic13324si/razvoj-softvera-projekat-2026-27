spring.application.name=studentski-server
server.port=8080

# ===============================
# MySQL
# Vrednosti se mogu zadati kroz env promenljive (DB_URL, DB_USERNAME, DB_PASSWORD),
# u suprotnom vaze podrazumevane vrednosti posle ':'
# createDatabaseIfNotExist=true -> baza "studenti_baza" se sama napravi pri prvom pokretanju
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studenti_baza?useSSL=true&requireSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
# korisnik se pravi skriptom docs/setup.sql (samo za lokalni razvoj)
spring.datasource.username=${DB_USERNAME:studenti_app}
spring.datasource.password=${DB_PASSWORD:studenti123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate pravi/menja tabele na osnovu entiteta:
#  update      - dodaje nove tabele/kolone, cuva podatke (za razvoj)
#  create-drop - brise sve pri gasenju (zgodno kad Seeder puni bazu pri startu)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# prebaci na true dok debagujes da vidis SQL koji Hibernate salje
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Bezbednost (JWT)
# U produkciji OBAVEZNO zadati JWT_SECRET (najmanje 32 karaktera), podrazumevani kljuc je samo za razvoj
# ===============================
app.security.jwt-secret=${JWT_SECRET:dev-tajni-kljuc-za-studentski-server-samo-lokalno-0123456789}
app.security.jwt-trajanje=${JWT_TRAJANJE:8h}
app.security.cors-origins=${CORS_ORIGINS:*}

# ===============================
# Seeder - puni praznu bazu pocetnim podacima pri startu
# ===============================
app.seed.ukljucen=${SEED_UKLJUCEN:true}
# lozinka za naloge koje pravi Seeder (svi seedovani studenti i nastavnici)
app.seed.lozinka=${SEED_LOZINKA:lozinka123}

# ===============================
# Skladiste fajlova (zip zadataka i resenja)
# Folder se pravi sam; relativna putanja se racuna od foldera iz kog je aplikacija pokrenuta
# ===============================
app.skladiste.koren=${SKLADISTE_KOREN:skladiste}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
