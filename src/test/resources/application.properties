# Testovi rade nad H2 bazom u memoriji (ne diraju lokalni MySQL)
spring.datasource.url=jdbc:h2:mem:studenti_baza;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT (isto kao u glavnom application.properties, ovaj fajl ga u testovima potpuno zamenjuje)
app.security.jwt-secret=dev-tajni-kljuc-za-studentski-server-samo-lokalno-0123456789
app.security.jwt-trajanje=8h
app.security.cors-origins=*

# Seeder se ne pokrece u testovima - svaki test pravi svoje podatke
app.seed.ukljucen=false

# fajlovi iz testova idu u target, koji se brise sa "mvnw clean"
app.skladiste.koren=target/test-skladiste
